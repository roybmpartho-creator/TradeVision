name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Grant execute permission for gradlew
        run: |
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleDebug
          elif [ -d "artifacts/overlay-trading-assistant/android" ]; then
            cd artifacts/overlay-trading-assistant/android && ./gradlew assembleDebug
          else
            echo "Android directory not found!" && exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeVision-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          
